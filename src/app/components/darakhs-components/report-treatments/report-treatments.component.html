<main id="main" class="main">
    <div class="pagetitle">
       <h1>Patients</h1>
       <nav>
          <ol class="breadcrumb">
             <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
             <li class="breadcrumb-item">Report</li>
             <li class="breadcrumb-item active">Treatments</li>
          </ol>
       </nav>
    </div>
    <section class="section">
      <div class="row">
         <div class="col-lg-12">
            <div class="card">
               <div class="card-body">
                  <h5 class="card-title">Treatments</h5>
                 <form class="row g-3 align-items-end">
                        <div class="col-md-2">
                          <label for="fromDt" class="form-label">From Date</label>
                          <input type="date" class="form-control"
                            id="fromDt" [(ngModel)]="fromDt"  name="fromDt">
                        </div>
                        <div class="col-md-1"></div>
                        <div class="col-md-2">
                          <label for="toDt" class="form-label">To Date</label>
                          <input type="date" class="form-control"
                            id="toDt" [(ngModel)]="toDt"  name="toDt">
                        </div>
                        <div class="col-md-1"></div>
                          <div class="col-md-4">
                             <select id="inputState" class="form-select" [(ngModel)]="treatmentId" name="treatmentId">
                                <option *ngFor="let treatment of treatments" [value]="treatment.Id"> {{treatment.TreamentName}}</option>
                            </select>
                          </div>

                        <div class="col-md-2">
                          <button type="submit" class="btn btn-primary" (click)="getPatients()"> Submit </button>
                        </div>
                 </form>
                 <br/>

                  <!-- <p>Add lightweight datatables to your project.</p> -->
                  <app-data-table [table]="table">
                  <table class="table">
                     <thead appTableHead [table]="table" [serial]="true"></thead>
                     <tbody>
                        <tr *ngFor="let patient of table.pageRows; let i = index">
                           <td>{{ table.serial(i) }}</td>
                           <td>{{ patient.FormDate  | date:'dd-MMM-yyyy' }}</td>
                           <td>{{patient.FullName}}</td>
                           <td>{{ CombineMobiles(patient) }}</td>
                           <td>{{ CombineAddress(patient) }}</td>
                           <td>{{ patient.TreamentName}}</td>
                        </tr>
                     </tbody>
                  </table>
                  </app-data-table>
               </div>
            </div>
         </div>
      </div>
   </section>
</main>
<!-- End #main -->
