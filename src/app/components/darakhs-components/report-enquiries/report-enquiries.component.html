<main id="main" class="main">
    <div class="pagetitle">
       <h1>Patients</h1>
       <nav>
          <ol class="breadcrumb">
             <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
             <li class="breadcrumb-item">Report</li>
             <li class="breadcrumb-item active">Enquiries</li>
          </ol>
       </nav>
    </div>
    <section class="section">
      <div class="row">
         <div class="col-lg-12">
            <div class="card">
               <div class="card-body">
                  <h5 class="card-title">Enquiries</h5>
                 <form class="row g-3 align-items-end">
                        <div class="col-md-2">
                          <label for="fromDt" class="form-label">From Date</label>
                          <input type="date" class="form-control"
                            id="fromDt" [(ngModel)]="fromDt"  name="fromDt">
                        </div>
                        <div class="col-md-1"></div>
                        <div class="col-md-2">
                          <label for="toDt" class="form-label">To Date</label>
                          <input type="date" class="form-control"
                            id="toDt" [(ngModel)]="toDt"  name="toDt">
                        </div>
                        <div class="col-md-1"></div>
                        <div class="col-md-2">
                          <button type="submit" class="btn btn-primary" (click)="getPatientEnquiries()"> Submit </button>
                        </div>
                 </form>
                 <br/>

                  <!-- <p>Add lightweight datatables to your project.</p> -->
                  <app-data-table [table]="table">
                  <table class="table">
                     <thead appTableHead [table]="table" [serial]="true"></thead>
                     <tbody>
                        <tr *ngFor="let patientEnquiry of table.pageRows; let i = index">
                            <td>{{ table.serial(i) }}</td>
                            <td>{{ patientEnquiry.FormDate  | date:'dd-MMM-yyyy hh:mm a' }}</td>
                            <td>{{ patientEnquiry.Name}}</td>
                            <td>{{ patientEnquiry.Mobile }}</td>
                            <td>{{ patientEnquiry.EnquiryFor}}</td>
                            <td>{{ CombineAddress(patientEnquiry) }}</td>
                        </tr>
                     </tbody>
                  </table>
                  </app-data-table>
               </div>
            </div>
         </div>
      </div>
   </section>
</main>
<!-- End #main -->
